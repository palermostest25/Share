name: Mobile checks

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'ios/**'
      - '.github/workflows/mobile.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: gradle --project-dir android :app:assembleDebug --no-daemon

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - run: xcodebuild -project ios/ShareMobile.xcodeproj -scheme ShareMobile -configuration Debug -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
