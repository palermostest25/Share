plugins { id 'com.android.application' }

android {
    namespace 'dev.denby.share'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.denby.share'
        minSdk 29
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('SHARE_ANDROID_KEYSTORE') ?: 'signing-not-configured.p12')
            storePassword System.getenv('SHARE_ANDROID_PASSWORD') ?: ''
            keyAlias 'share'
            keyPassword System.getenv('SHARE_ANDROID_PASSWORD') ?: ''
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
