<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#10131a">
  <title>Share</title>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/transfers.css">
</head>
<body>
  <header>
    <div class="brand"><span class="mark">S</span><strong>Share</strong></div>
    <nav class="actions" aria-label="File actions">
      <button id="back" title="Back">←</button>
      <button id="up" title="Up">↑</button>
      <button id="refresh" title="Refresh">↻</button>
      <button id="new-folder">New folder</button>
      <label class="primary" for="upload-input">Upload</label>
      <input id="upload-input" type="file" multiple hidden>
      <button id="logout" title="Forget access key">Lock</button>
    </nav>
  </header>

  <main>
    <aside>
      <button id="all-files" class="side active">All files</button>
      <button id="favourite-current" class="side">☆ Favourite folder</button>
      <h2>Favourites</h2>
      <div id="favourites"></div>
    </aside>

    <section class="browser" id="drop-zone">
      <div class="pathbar">
        <div id="breadcrumbs" aria-label="Current path"></div>
        <input id="filter" type="search" placeholder="Filter this folder" autocomplete="off">
      </div>
      <div id="notice" hidden></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th data-sort="name">Name</th><th data-sort="size">Size</th><th data-sort="modified">Modified</th><th>Actions</th></tr></thead>
          <tbody id="entries"></tbody>
        </table>
        <div id="empty" hidden>This folder is empty.</div>
      </div>
      <div id="transfers" hidden>
        <h2>Transfers</h2>
        <div id="transfer-list"></div>
      </div>
      <footer><span id="count">0 items</span><span>Files stay on your NAS</span></footer>
    </section>
  </main>

  <dialog id="login-dialog">
    <form method="dialog" id="login-form">
      <div class="dialog-brand"><span class="mark">S</span></div>
      <h1>Open Share</h1>
      <p>Enter the shared access key. Share keeps it in this tab’s session storage until you lock it or close the tab.</p>
      <label>Access key<input id="access-key" type="password" minlength="32" required autocomplete="current-password"></label>
      <p class="error" id="login-error" hidden></p>
      <button class="primary" value="default">Connect</button>
    </form>
  </dialog>

  <dialog id="media-dialog">
    <div class="media-head"><strong id="media-title"></strong><button id="media-close">Close</button></div>
    <video id="video" controls playsinline hidden></video>
    <audio id="audio" controls hidden></audio>
  </dialog>

  <dialog id="confirm-dialog">
    <form method="dialog">
      <h2 id="confirm-title">Confirm</h2>
      <p id="confirm-text"></p>
      <div class="dialog-actions"><button value="cancel">Cancel</button><button id="confirm-ok" class="danger" value="ok">Delete</button></div>
    </form>
  </dialog>

  <script src="/assets/app.js" defer></script>
</body>
</html>
